<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <script type="text/javascript">
      // Save the path that user was trying to access
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var redirect = '/' + pathSegments.join('/');
      
      // Store it so React can access it
      sessionStorage.setItem('postBuildRedirect', redirect);
      
      // Redirect to the app root so React Router can handle the stored path.
      // GitHub Pages serves this 404 for every deep link, so redirecting to the
      // current folder can trap nested routes in a refresh loop.
      window.location.replace('/jonathancw-tang/');
    </script>
  </head>
  <body>
  </body>
</html>
